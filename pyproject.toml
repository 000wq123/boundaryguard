[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaryguard"
version = "0.1.0"
description = "Detect and remove invisible Unicode security hazards (Trojan Source / CVE-2021-42574 class)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Davor Radeski" }]
keywords = [
    "security",
    "unicode",
    "trojan-source",
    "bidi",
    "zero-width",
    "cve-2021-42574",
    "prompt-injection",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
boundaryguard = "boundaryguard.cli:main"

[tool.setuptools.packages.find]
include = ["boundaryguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
