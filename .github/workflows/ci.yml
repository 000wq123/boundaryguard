name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -v
      - name: Self-scan (dogfooding)
        run: |
          boundaryguard check --recursive . --policy security || true
        # fixtures are intentionally dirty, so scan only source:
      - name: Self-scan source (strict)
        run: |
          boundaryguard check boundaryguard/ --policy security
          boundaryguard check tests/test_core.py --policy security
          boundaryguard check tests/test_cli.py --policy security

  mutation:
    name: Mutation testing (security guards)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Run mutation suite
        run: python scripts/mutation_test.py
